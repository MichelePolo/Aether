name: Desktop packages

# Builds the native Electron installers (Windows .exe, macOS .dmg, Linux
# .AppImage + .deb) on native runners.
#
# Two modes:
#  - CI (pull_request / push / workflow_dispatch): uploads each installer as a
#    workflow artifact for smoke-download from the run page.
#  - Release (workflow_call with `release_tag`): renames each installer to a
#    stable, version-independent name and attaches it to that GitHub Release, so
#    the minisite can link `releases/latest/download/<name>` permalinks — the
#    same trick the prebuilt tarball uses. Driven from release-please.yml
#    because a release cut with GITHUB_TOKEN does not trigger `on: release`.
on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Attach installers to this GitHub Release tag instead of uploading workflow artifacts.'
        type: string
        required: false
        default: ''
  pull_request:
    paths:
      - 'app/desktop/**'
      - 'server/**'
      - 'src/**'
      - 'scripts/build.mjs'
      - 'package.json'
      - 'package-lock.json'
  push:
    paths:
      - 'app/desktop/**'
      - 'server/**'
      - 'src/**'
      - 'scripts/build.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: desktop-packages-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # needed to attach installers to a release (unused by CI runs)
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            command: dist:win
            artifact: aether-windows-x64
          - label: Ubuntu x64
            os: ubuntu-latest
            command: dist:linux
            artifact: aether-ubuntu-x64
          - label: macOS Intel
            os: macos-15-intel
            command: dist:mac:x64
            artifact: aether-macos-x64
          - label: macOS Apple Silicon
            os: macos-latest
            command: dist:mac:arm64
            artifact: aether-macos-arm64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/desktop/package-lock.json

      - name: Install core dependencies
        run: npm ci

      - name: Install desktop dependencies for the current platform
        run: npm ci --prefix app/desktop

      - name: Package application
        run: npm --prefix app/desktop run ${{ matrix.command }}

      # --- CI mode: keep the installer as a downloadable workflow artifact ---
      - name: Upload installer artifact
        if: ${{ inputs.release_tag == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            app/desktop/dist/*.exe
            app/desktop/dist/*.dmg
            app/desktop/dist/*.deb
            app/desktop/dist/*.AppImage
          if-no-files-found: error

      # --- Release mode: rename to a stable name and attach to the release ---
      # electron-builder stamps the version into each filename; the minisite
      # needs a permalink, so we rename to a fixed name before uploading. Each
      # single-extension glob matches exactly one file on its own platform (the
      # dmg's arch is read off the filename), so every loop is a no-op on the
      # platforms that don't produce that extension.
      - name: Attach installers to the release
        if: ${{ inputs.release_tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          cd app/desktop/dist
          shopt -s nullglob
          for f in *.exe;      do mv -f "$f" Aether-windows-x64.exe;       gh release upload "$TAG" Aether-windows-x64.exe --clobber; done
          for f in *.AppImage; do mv -f "$f" Aether-linux-x86_64.AppImage; gh release upload "$TAG" Aether-linux-x86_64.AppImage --clobber; done
          for f in *.deb;      do mv -f "$f" Aether-linux-amd64.deb;        gh release upload "$TAG" Aether-linux-amd64.deb --clobber; done
          for f in *.dmg; do
            case "$f" in
              *arm64*) name=Aether-macos-arm64.dmg ;;
              *)       name=Aether-macos-x64.dmg ;;
            esac
            mv -f "$f" "$name"
            gh release upload "$TAG" "$name" --clobber
          done
